# =======================================================================
# mentor-api-schema-registration :: values.yaml
# Registers Protobuf schemas consumed by mentor-api into Apicurio Registry.
# Schemas are produced by the identity CDC pipeline (RisingWave → AutoMQ).
# Source of truth for schema definitions: contracts/proto/students/v1/events.proto
# =======================================================================

apicurioUrl: "http://apicurio.streaming.svc.cluster.local:8080"
hookWeight: "8"

schemas:
  - subject: "students.v1.StudentOnboardingReady"
    # Source: contracts/proto/students/v1/events.proto
    # Self-contained (no imports) — if imports are added, Job must use references API
    proto: |
      syntax = "proto3";
      package students.v1;
      option go_package = "github.com/mathtrail/contracts/gen/go/students/v1;studentsv1";
      message StudentOnboardingReady {
        string event_id    = 1;
        string user_id     = 2;
        string email       = 3;
        string first_name  = 4;
        string last_name   = 5;
        string role        = 6;
        string occurred_at = 7;
      }

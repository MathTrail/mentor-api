# NetworkPolicies for mentor-api — namespace is set by Skaffold defaultNamespace
# Controls egress from mentor-api to monitoring.

---
# Allow mentor-api to push OTel traces and profiling data to the collector in monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mentor-otel-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mentor-api
  policyTypes:
    - Egress
  egress:
    # OTel Collector (monitoring namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4317  # OTLP gRPC
        - protocol: TCP
          port: 4318  # OTLP HTTP
        - protocol: TCP
          port: 4040  # Pyroscope push
        - protocol: TCP
          port: 9411  # Zipkin
    # PostgreSQL via PgBouncer (same namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mathtrail
      ports:
        - protocol: TCP
          port: 6432
    # Kafka (AutoMQ) and Apicurio Schema Registry (streaming namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: streaming
      ports:
        - protocol: TCP
          port: 9092  # Kafka bootstrap / broker
        - protocol: TCP
          port: 8080  # Apicurio Schema Registry
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
